<section
  class="emoji-mart {{ darkMode() ? 'emoji-mart-dark' : '' }}"
  [style.width]="width()"
  [ngStyle]="style()"
>
  <div class="emoji-mart-bar">
    <emoji-mart-anchors
      [categories]="allCategories()"
      (anchorClick)="handleAnchorClick($event)"
      [color]="color()"
      [selected]="selected"
      [i18n]="mergedI18n()"
      [icons]="mergedCategoriesIcons()"
    ></emoji-mart-anchors>
  </div>
  @if (enableSearch()) {
    <emoji-search
      [i18n]="mergedI18n()"
      (searchResults)="handleSearch($event)"
      (enterKey)="handleEnterKey($event)"
      [include]="include() ?? []"
      [exclude]="exclude() ?? []"
      [custom]="custom()"
      [autoFocus]="autoFocus()"
      [icons]="mergedSearchIcons()"
      [emojisToShowFilter]="emojisToShowFilter()"
    ></emoji-search>
  }
  <section #scrollRef class="emoji-mart-scroll" [attr.aria-label]="mergedI18n().emojilist">
    @for (category of displayedCategories(); track category.id) {
      <emoji-category
        [id]="category.id"
        [name]="category.name"
        [emojis]="category.emojis"
        [perLine]="perLine()"
        [totalFrequentLines]="totalFrequentLines()"
        [hasStickyPosition]="isNative()"
        [i18n]="mergedI18n()"
        [hideObsolete]="hideObsolete()"
        [notFoundEmoji]="notFoundEmoji()"
        [custom]="category.id === RECENT_CATEGORY.id ? (CUSTOM_CATEGORY.emojis ?? []) : []"
        [recent]="category.id === RECENT_CATEGORY.id ? recent() : undefined"
        [virtualize]="virtualize()"
        [virtualizeOffset]="virtualizeOffset()"
        [emojiIsNative]="isNative()"
        [emojiSkin]="currentSkin()"
        [emojiSize]="emojiSize()"
        [emojiSet]="set()"
        [emojiSheetSize]="sheetSize()"
        [emojiForceSize]="isNative()"
        [emojiTooltip]="emojiTooltip()"
        [emojiBackgroundImageFn]="backgroundImageFn()"
        [emojiImageUrlFn]="imageUrlFn()"
        [emojiUseButton]="useButton()"
        (emojiOver)="handleEmojiOver($event)"
        (emojiLeave)="handleEmojiLeave()"
        (emojiClick)="handleEmojiClick($event)"
      ></emoji-category>
    }
  </section>
  @if (showPreview()) {
    <div class="emoji-mart-bar">
      <emoji-preview
        [title]="title()"
        [emoji]="previewEmoji"
        [idleEmoji]="emoji()"
        [emojiIsNative]="isNative()"
        [emojiSize]="38"
        [emojiSkin]="currentSkin()"
        [emojiSet]="set()"
        [i18n]="mergedI18n()"
        [emojiSheetSize]="sheetSize()"
        [emojiBackgroundImageFn]="backgroundImageFn()"
        [emojiImageUrlFn]="imageUrlFn()"
        (skinChange)="handleSkinChange($event)"
      ></emoji-preview>
    </div>
  }
</section>
